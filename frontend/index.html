<!-- @dsCard group="Sentinel Control Plane" viewport="1440x900" name="Control plane" subtitle="Operator console: what happened, what Sentinel decided, and why" -->
<!-- @startingPoint section="Sentinel" subtitle="Full dark control-plane console" viewport="1440x900" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sentinel — Control plane</title>
<link rel="stylesheet" href="styles.css?v=3">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js?v=3"></script>
<style>html,body{height:100%}body{margin:0;overflow:hidden;background:#0A0C11}#root{height:100vh}</style>
</head><body class="sentinel-dark"><div id="root"></div>
<!--
  Data.jsx here is the real-data adapter (GET /api/cases + GET /api/cases/{id}
  on this same FastAPI backend), not the original design export's hardcoded
  fixtures. Cases.jsx, DecisionRecord.jsx, Primitives.jsx are byte-identical
  to the export; Overview.jsx and Review.jsx have their hardcoded stats and
  fixture-ID-keyed text replaced with values computed from the same real
  `cases` array (see the comments at the top of each file). Reliability,
  Audit and Scenario are still copied into this directory but left out of
  both this list and Shell.jsx's nav -- their JSX leans on fixture-only
  concepts (a multi-region executor fleet, a fixed narrative script) with no
  real equivalent in this backend.

  Cache-busting: FastAPI's StaticFiles serves these with no Cache-Control
  header, so a browser can silently keep serving an old cached copy of a
  .jsx file after it changes on disk -- exactly what happened here once
  (DecisionRecord.jsx showing stale pre-redesign text). Every local script
  below carries a `?v=N`; bump N on every file below whenever its content
  changes so the browser is forced to re-fetch.
-->
<script type="text/babel" src="Data.jsx?v=4"></script>
<script type="text/babel" src="Primitives.jsx?v=3"></script>
<script type="text/babel" src="Shell.jsx?v=3"></script>
<script type="text/babel" src="Overview.jsx?v=3"></script>
<script type="text/babel" src="Cases.jsx?v=3"></script>
<script type="text/babel" src="DecisionRecord.jsx?v=5"></script>
<script type="text/babel" src="Review.jsx?v=3"></script>
<script type="text/babel">
(() => {
const { Toast } = window.SentinelDesignSystem_8a81b0;

function App() {
  const [view, setView] = React.useState('overview');
  const [selected, setSelected] = React.useState(null);
  const [record, setRecord] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [cases, setCases] = React.useState(null); // null = still loading
  const [loadError, setLoadError] = React.useState(null);

  const load = React.useCallback(() => {
    setLoadError(null);
    window.loadSentinelData().then(setCases).catch((err) => setLoadError(String(err)));
  }, []);
  React.useEffect(() => { load(); }, [load]);

  const showToast = (t) => { setToast(t); window.clearTimeout(window.__st); window.__st = window.setTimeout(() => setToast(null), 3400); };
  const openRecord = (id) => { setSelected(id); setRecord(id); };
  const go = (v) => { setRecord(null); setView(v); };

  if (loadError) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%', alignItems: 'center', justifyContent: 'center', gap: 14, background: 'var(--bg-app)', color: 'var(--text-secondary)' }}>
        <span style={{ font: 'var(--fw-semibold) 16px/1.3 var(--font-sans)', color: 'var(--status-blocked-fg)' }}>Could not load cases from the Sentinel API</span>
        <span style={{ font: 'var(--type-mono)', fontSize: 12 }}>{loadError}</span>
        <button type="button" onClick={load} style={{ height: 30, padding: '0 14px', borderRadius: 4, border: '1px solid var(--border-strong)', background: 'var(--bg-surface)', color: 'var(--text-primary)', cursor: 'pointer' }}>Retry</button>
      </div>
    );
  }

  if (cases === null) {
    return (
      <div style={{ display: 'flex', height: '100%', alignItems: 'center', justifyContent: 'center', background: 'var(--bg-app)', color: 'var(--text-tertiary)', font: 'var(--type-body-sm)' }}>
        Loading cases…
      </div>
    );
  }

  const attention = cases.filter((c) => ['blocked', 'escalated', 'failed'].includes(c.status)).length;
  const reviewCount = cases.filter((c) => c.stages.some((s) => s.label === 'Review' && s.state === 'active')).length;

  let body;
  if (record) {
    body = <window.DecisionRecord c={cases.find((c) => c.id === record)} onBack={() => setRecord(null)}
      onToast={showToast} />;
  } else if (view === 'overview') {
    body = <window.Overview cases={cases} onOpen={openRecord} onGo={go} />;
  } else if (view === 'review') {
    body = <window.Review cases={cases} onOpen={openRecord}
      onToast={() => showToast({ tone: 'neutral', title: 'Noted for this session', detail: 'not yet sent to the backend' })} />;
  } else {
    body = <window.Cases cases={cases} onOpen={openRecord} />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'var(--bg-app)' }}>
      <window.CommandBar view={record ? 'cases' : view} onSelect={go}
        counts={{ review: reviewCount }} attention={attention} />
      <main style={{ flex: 1, minHeight: 0, position: 'relative' }}>{body}</main>
      {toast ? <div style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 80 }}><Toast {...toast} onDismiss={() => setToast(null)} /></div> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
