<!-- @dsCard group="Components" viewport="700x220" name="Status — outcomes and reliability" subtitle="Fixed outcome vocabulary, dots and meters" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.SentinelDesignSystem_8a81b0;
const { StatusBadge, SeverityDot, ReliabilityMeter } = NS;
function Card() {
  return (
    <div className="col">
      <div className="row">
        {['allowed','blocked','escalated','failed','conflict','pending','review'].map(s => <StatusBadge key={s} status={s} />)}
      </div>
      <div className="row" style={{ gap: 20 }}>
        <SeverityDot status="allowed" label="Healthy" />
        <SeverityDot status="escalated" label="Awaiting review" pulse />
        <SeverityDot status="blocked" label="Blocked at GOVERN" />
        <SeverityDot status="failed" label="Execution failed" />
        <SeverityDot status="pending" label="Queued" />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 20 }}>
        <ReliabilityMeter label="Execution success" value={99.4} target="target 99.5% · 30d" />
        <ReliabilityMeter label="Govern latency budget" value={82} tone="escalated" target="p99 118ms" />
        <ReliabilityMeter label="Agent agreement" value={64} tone="blocked" target="12 conflicts today" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
