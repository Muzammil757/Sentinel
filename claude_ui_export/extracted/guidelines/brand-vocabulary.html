<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<span style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;padding:5px 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-3)">Intake</span><span style="color:var(--text-tertiary)">→</span><span style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;padding:5px 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-3)">Weigh</span><span style="color:var(--text-tertiary)">→</span><span style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;padding:5px 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-3)">Govern</span><span style="color:var(--text-tertiary)">→</span><span style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;padding:5px 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-3)">Execution</span><span style="color:var(--text-tertiary)">→</span><span style="font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;padding:5px 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-3)">Human review</span>
</div>
<p style="font:var(--type-body-sm);color:var(--text-secondary);max-width:70ch;text-wrap:pretty">Say what happened, then why: “Blocked before any external call. Amount exceeds the vendor ceiling by 41%.” Human review annotates; it never authorises. Never write “approve”, “override” or “force” in review surfaces.</p>
</div></body></html>
