<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-800)"></div><div class="mono">--blue-800</div></div><div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="mono">--blue-700</div></div><div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="mono">--blue-600</div></div><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="mono">--blue-500</div></div><div class="sw"><div class="chip" style="background:var(--blue-400)"></div><div class="mono">--blue-400</div></div><div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="mono">--blue-100</div></div><div class="sw"><div class="chip" style="background:var(--blue-50)"></div><div class="mono">--blue-50</div></div></div></body></html>
