<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="mono">--ink-900</div></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="mono">--ink-700</div></div><div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="mono">--ink-600</div></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="mono">--ink-500</div></div><div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="mono">--ink-400</div></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="mono">--ink-300</div></div><div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="mono">--ink-200</div></div><div class="sw"><div class="chip" style="background:var(--ink-150)"></div><div class="mono">--ink-150</div></div><div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="mono">--ink-100</div></div><div class="sw"><div class="chip" style="background:var(--ink-50)"></div><div class="mono">--ink-50</div></div></div></body></html>
