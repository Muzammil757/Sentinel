<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Borders first; shadow only for things that float" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row">
<div class="sw"><div style="height:48px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-4);box-shadow:var(--shadow-1)"></div><div class="mono">--shadow-1</div><div style="font:var(--type-caption);color:var(--text-secondary)">resting control</div></div><div class="sw"><div style="height:48px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-4);box-shadow:var(--shadow-2)"></div><div class="mono">--shadow-2</div><div style="font:var(--type-caption);color:var(--text-secondary)">popover / toast</div></div><div class="sw"><div style="height:48px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-4);box-shadow:var(--shadow-popover)"></div><div class="mono">--shadow-popover</div><div style="font:var(--type-caption);color:var(--text-secondary)">dialog</div></div>
<div class="sw"><div style="height:48px;background:var(--bg-surface);border-radius:var(--radius-4);box-shadow:var(--shadow-hairline)"></div><div class="mono">--shadow-hairline</div><div style="font:var(--type-caption);color:var(--text-secondary)">inset outline</div></div>
</div></body></html>
