<!-- @dsCard group="Colors" viewport="700x150" name="Text colours" subtitle="Three levels of ink plus accent and inverse" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
<div><div style="font:var(--type-subheading);color:var(--text-primary)">Primary</div><div class="mono">--text-primary</div></div>
<div><div style="font:var(--type-subheading);color:var(--text-secondary)">Secondary</div><div class="mono">--text-secondary</div></div>
<div><div style="font:var(--type-subheading);color:var(--text-tertiary)">Tertiary</div><div class="mono">--text-tertiary</div></div>
<div><div style="font:var(--type-subheading);color:var(--text-accent)">Accent / link</div><div class="mono">--text-accent</div></div>
<div style="background:var(--bg-console);padding:6px 8px;border-radius:var(--radius-3)"><div style="font:var(--type-subheading);color:var(--text-inverse)">Inverse</div><div class="mono" style="color:var(--text-inverse-secondary)">--text-inverse</div></div>
</div></body></html>
