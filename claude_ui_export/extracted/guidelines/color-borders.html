<!-- @dsCard group="Colors" viewport="700x130" name="Borders" subtitle="Hairline to emphasis — Sentinel separates with lines, not shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row">
<div class="sw"><div style="height:44px;border:1px solid var(--border-hairline);border-radius:var(--radius-4);background:var(--bg-surface)"></div><div class="mono">--border-hairline</div></div><div class="sw"><div style="height:44px;border:1px solid var(--border-subtle);border-radius:var(--radius-4);background:var(--bg-surface)"></div><div class="mono">--border-subtle</div></div><div class="sw"><div style="height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-4);background:var(--bg-surface)"></div><div class="mono">--border-strong</div></div><div class="sw"><div style="height:44px;border:1px solid var(--border-emphasis);border-radius:var(--radius-4);background:var(--bg-surface)"></div><div class="mono">--border-emphasis</div></div>
<div class="sw"><div style="height:44px;border:1px solid var(--border-console);border-radius:var(--radius-4);background:var(--bg-console)"></div><div class="mono">--border-console</div></div>
</div></body></html>
