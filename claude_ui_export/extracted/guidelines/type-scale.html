<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="width:120px">--type-display</span><span style="font:var(--type-display);letter-spacing:var(--ls-display)">Cases awaiting review</span></div>
<div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="width:120px">--type-title</span><span style="font:var(--type-title);letter-spacing:var(--ls-heading)">Vendor payout above ceiling</span></div>
<div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="width:120px">--type-heading</span><span style="font:var(--type-heading);letter-spacing:var(--ls-heading)">GOVERN decision</span></div>
<div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="width:120px">--type-subheading</span><span style="font:var(--type-subheading)">Candidate options</span></div>
</div></body></html>
