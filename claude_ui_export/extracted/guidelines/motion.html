<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="80–260ms, standard ease; state changes never animate colour of status" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.box{height:34px;border-radius:var(--radius-4);background:var(--bg-inset);border:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 10px;font:var(--type-mono);transition:background-color var(--dur-base) var(--ease-standard)}.box:hover{background:var(--bg-active)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div class="box">--dur-instant</div><div style="font:var(--type-caption);color:var(--text-secondary);margin-top:5px">80ms · press feedback</div></div><div><div class="box">--dur-fast</div><div style="font:var(--type-caption);color:var(--text-secondary);margin-top:5px">120ms · hover, focus</div></div><div><div class="box">--dur-base</div><div style="font:var(--type-caption);color:var(--text-secondary);margin-top:5px">180ms · panels, rows</div></div><div><div class="box">--dur-slow</div><div style="font:var(--type-caption);color:var(--text-secondary);margin-top:5px">260ms · overlays</div></div>
</div>
<div class="mono" style="margin-top:14px">--ease-standard cubic-bezier(.2,0,.2,1) · --ease-out cubic-bezier(.16,1,.3,1)</div></body></html>
