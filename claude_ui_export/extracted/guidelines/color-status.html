<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row"><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-allowed-bg);color:var(--status-allowed-fg);border-radius:var(--radius-3);font:var(--fw-medium) var(--fs-11)/1 var(--font-sans);letter-spacing:var(--ls-caps);text-transform:uppercase">Allowed</div><div class="mono">--status-allowed-fg</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-escalated-bg);color:var(--status-escalated-fg);border-radius:var(--radius-3);font:var(--fw-medium) var(--fs-11)/1 var(--font-sans);letter-spacing:var(--ls-caps);text-transform:uppercase">Escalated</div><div class="mono">--status-escalated-fg</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-blocked-bg);color:var(--status-blocked-fg);border-radius:var(--radius-3);font:var(--fw-medium) var(--fs-11)/1 var(--font-sans);letter-spacing:var(--ls-caps);text-transform:uppercase">Blocked</div><div class="mono">--status-blocked-fg</div></div><div class="sw"><div style="display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--status-failed-bg);color:var(--status-failed-fg);border-radius:var(--radius-3);font:var(--fw-medium) var(--fs-11)/1 var(--font-sans);letter-spacing:var(--ls-
