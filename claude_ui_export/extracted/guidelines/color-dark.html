<!-- @dsCard group="Colors" viewport="700x160" name="Control-plane dark theme" subtitle=".sentinel-dark inverts every semantic token — the product's real foundation" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#0A0C11}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}.chip{height:46px;border-radius:var(--radius-3);border:1px solid rgba(255,255,255,.09)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head><body class="sentinel-dark"><div class="row">
<div class="sw"><div class="chip" style="background:var(--bg-app)"></div><div class="mono">--bg-app</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-surface)"></div><div class="mono">--bg-surface</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-raised)"></div><div class="mono">--bg-raised</div></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="mono">--accent</div></div>
<div class="sw"><div class="chip" style="background:var(--teal)"></div><div class="mono">--teal</div></div>
<div class="sw"><div class="chip" style="background:var(--status-allowed-dot)"></div><div class="mono">allowed</div></div>
<div class="sw"><div class="chip" style="background:var(--status-escalated-dot)"></div><div class="mono">escalated</div></div>
<div class="sw"><div class="chip" style="background:var(--status-blocked-dot)"></div><div class="mono">blocked</div></div>
<div class="sw"><div class="chip" style="background:var(--status-conflict-dot)"></div><div class="mono">conflict</div></div>
</div></body></html>
