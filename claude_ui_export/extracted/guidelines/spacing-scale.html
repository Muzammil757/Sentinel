<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:16px;font:var(--type-body)}.row{display:flex;gap:8px;flex-wrap:wrap}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.chip{height:44px;border-radius:var(--radius-3);border:1px solid rgba(11,14,19,.06)}.mono{font:var(--type-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-2);height:var(--space-2);background:var(--ink-700)"></div><span class="mono">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-4);height:var(--space-4);background:var(--ink-700)"></div><span class="mono">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-6);height:var(--space-6);background:var(--ink-700)"></div><span class="mono">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-8);height:var(--space-8);background:var(--ink-700)"></div><span class="mono">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-10);height:var(--space-10);background:var(--ink-700)"></div><span class="mono">10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-12);height:var(--space-12);background:var(--ink-700)"></div><span class="mono">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-16);height:var(--space-16);background:var(--ink-700)"></div><span class="mono">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-20);height:var(--space-20);background:var(--ink-700)"></div><span class="mono">20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-24);height:var(--space-24);background:var(--ink-700)"></div><span class="mono">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-32);height:var(--space-32);background:var(--ink-700)"></div><span class="mono">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:var(--space-40);height:var(--space-40);background:var(--ink-700)"></div><span class="mono">40</span></div>
</div></body></html>
